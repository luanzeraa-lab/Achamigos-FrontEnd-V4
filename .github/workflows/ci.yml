name: Release

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - develop
      - 'feature/*'
    tags-ignore:
      - '*'

jobs:
  version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Rodar build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY_HML }}
          
        run: npm run build

      - name: Rodar testes
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Validação)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: front-end:test

      # =========================================
      # INSTALAR SEMVER
      # =========================================
      - name: Instalar semver
        run: npm install -g semver

      # =========================================
      # CRIAR TAG INICIAL
      # =========================================
      - name: Criar tag inicial caso não exista
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags

          if [ -z "$(git tag)" ]; then
            git config --global user.name "github-actions"
            git config --global user.email "github-actions@github.com"

            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git

            git tag -a v0.0.0 -m "Initial release"
            git push origin v0.0.0
          fi

      # =========================================
      # CALCULAR NOVA VERSÃO INTELIGENTE
      # =========================================
      - name: Calcular nova versão
        id: version
        run: |
          git fetch --tags

          LAST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1))

          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v0.0.0"
          fi

          echo "Versão atual: $LAST_TAG"

          COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s")

          echo "Commits encontrados:"
          echo "$COMMITS"

          VERSION_TYPE="patch"

          while IFS= read -r COMMIT
          do
            echo "Analisando commit: $COMMIT"

            if [[ "$COMMIT" == *"BREAKING CHANGE"* ]]; then
              VERSION_TYPE="major"
              break

            elif [[ "$COMMIT" =~ ^feat(\(.+\))?: ]]; then
              VERSION_TYPE="minor"

            elif [[ "$COMMIT" =~ ^fix(\(.+\))?: ]]; then
              if [ "$VERSION_TYPE" != "minor" ]; then
                VERSION_TYPE="patch"
              fi
            fi

          done <<< "$COMMITS"

          CURRENT_VERSION=${LAST_TAG#v}
          # Remove sufixos de beta se a última tag veio da develop para o semver calcular corretamente
          CURRENT_VERSION=${CURRENT_VERSION%-beta}

          NEW_VERSION=$(semver -i $VERSION_TYPE $CURRENT_VERSION)

          echo "Nova versão: $NEW_VERSION"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          # Mantido também no GITHUB_ENV para compatibilidade com os passos abaixo que usam ${{ env.new_version }}
          echo "new_version=$NEW_VERSION" >> $GITHUB_ENV

      # =========================================
      # ATUALIZAR PACKAGE.JSON
      # =========================================
      - name: Atualizar package.json
        run: |
          npm version ${{ steps.version.outputs.new_version }} --no-git-tag-version

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verificar/Cria repositório no Docker Hub
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}"
          echo "Verificando se repositório existe: $REPO"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "${{ secrets.DOCKERHUB_USERNAME }}:${{ secrets.DOCKERHUB_TOKEN }}" \
            https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}/)

          if [ "$STATUS" = "200" ]; then
            echo "Repositório já existe 👍"
          else
            echo "Repositório não existe. Criando..."
            curl -X POST \
              -H "Content-Type: application/json" \
              -u "${{ secrets.DOCKERHUB_USERNAME }}:${{ secrets.DOCKERHUB_TOKEN }}" \
              -d "{\"name\": \"${{ secrets.DOCKERHUB_REPO }}\", \"is_private\": false}" \
              https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/
            echo "Repositório criado com sucesso!"
          fi

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:${{ env.new_version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://achamigos-backend-latest.onrender.com

      - name: Trigger Render Deploy (Frontend HML)
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}&imgURL=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:latest"

      # =========================================
      # COMMIT E CONTROLE DE TAGS
      # =========================================
      - name: Commit e controle de tags
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git

          git add package.json package-lock.json
          git commit -m "chore(release): version ${{ env.new_version }} [skip ci]" || echo "Sem mudanças"

          BRANCH_NAME="${{ github.ref_name }}"

          # Sempre envia o commit para a branch atual
          git push origin HEAD:${{ github.ref_name }}

          # Controle de tags baseado na Branch
          if [ "$BRANCH_NAME" = "main" ]; then
            TAG_NAME="v${{ env.new_version }}"
          elif [ "$BRANCH_NAME" = "develop" ]; then
            TAG_NAME="v${{ env.new_version }}-beta"
          else
            echo "Branch $BRANCH_NAME não gera tag"
            exit 0
          fi

          # Evita erro se a tag já existir local ou remotamente
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
          fi

          - name: Trigger Render Deploy (Frontend HML)
            run: |
              curl "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}&imgURL=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:latest"

      - name: Enviar email se falhar
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Falha no pipeline - ${{ github.repository }}
          body: O pipeline do GitHub Actions falhou.
          to: ${{ secrets.EMAIL_USER }}
          from: GitHub Actions